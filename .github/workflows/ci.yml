name: CI

on:
  push:
  pull_request:

jobs:
  # The blocking signal: everything that must be true for the app to build
  # and for its logic to be correct.
  build:
    name: Build, types, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # Browser tests run on every push and their results are visible, but they
  # do NOT block the run right now.
  #
  # WHY: the 2026-08-12 design direction retired typed-port dragging as the
  # everyday connection language (§2). Twenty of these specs still drive
  # `.port-star[data-port-direction=...]`, an interaction the app no longer
  # offers, so they report failure regardless of whether the app works. A
  # suite that is red for a known, unrelated reason hides real regressions
  # in the specs that ARE still meaningful.
  #
  # REMOVE `continue-on-error` once those specs are rewritten against the
  # universal ports. That rewrite is blocked on one product decision --
  # whether a plain connection carries meaning (see PROGRESS.md, "three
  # decisions"). This is a deliberate, temporary exception, not a pass.
  browser:
    name: Browser tests (known-stale specs, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
