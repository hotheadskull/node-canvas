[package]
name = "node-canvas"
version = "2.0.0"
description = "Node Canvas — visual thought-processing on an infinite canvas"
authors = ["hotheadskull"]
edition = "2021"

[lib]
name = "node_canvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
